<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>駿景園 Shuttle Bus · NR815</title>
<style>
  :root {
    --bg: #0f1720;
    --card: #182430;
    --card2: #1f2f3f;
    --accent: #4cc2ff;
    --accent2: #ffd166;
    --text: #eaf2f8;
    --muted: #8ba3b5;
    --good: #5ee0a0;
    --warn: #ff8a80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 460px; }

  header { text-align: center; margin: 12px 0 18px; }
  header h1 { font-size: 1.45rem; letter-spacing: .5px; }
  header .sub { color: var(--muted); font-size: .85rem; margin-top: 4px; }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }

  /* 方向選擇 */
  .dir-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .dir-btn {
    border: 2px solid transparent;
    background: var(--card2);
    color: var(--muted);
    border-radius: 12px;
    padding: 12px 8px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
    line-height: 1.35;
  }
  .dir-btn small { display: block; font-size: .72rem; font-weight: 400; margin-top: 2px; }
  .dir-btn.active {
    background: rgba(76,194,255,.12);
    border-color: var(--accent);
    color: var(--text);
  }

  /* 日類型 */
  .day-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    font-size: .85rem;
  }
  .day-badge {
    background: var(--card2);
    color: var(--accent2);
    border-radius: 999px;
    padding: 4px 12px;
    font-weight: 600;
  }
  .override {
    background: none;
    border: none;
    color: var(--muted);
    font-size: .78rem;
    text-decoration: underline;
    cursor: pointer;
  }

  /* 倒數 */
  .now { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 6px; }
  .next-time { text-align: center; font-size: 3.4rem; font-weight: 800; letter-spacing: 1px; color: var(--accent); line-height: 1.1; }
  .countdown { text-align: center; font-size: 1.35rem; font-weight: 700; margin-top: 6px; }
  .countdown.soon { color: var(--warn); }
  .countdown.ok { color: var(--good); }
  .next-label { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .ended { text-align: center; font-size: 1.1rem; color: var(--warn); padding: 18px 0 6px; }
  .ended small { display: block; color: var(--muted); margin-top: 8px; font-size: .85rem; }

  /* 之後班次 */
  .upcoming { margin-top: 14px; border-top: 1px solid rgba(255,255,255,.07); padding-top: 12px; }
  .upcoming h3 { font-size: .8rem; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .bus-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    font-size: 1.05rem;
  }
  .bus-row + .bus-row { border-top: 1px solid rgba(255,255,255,.05); }
  .bus-row .in { color: var(--muted); font-size: .82rem; }
  .bus-row.next { color: var(--accent); font-weight: 700; }

  details { margin-top: 4px; }
  summary {
    cursor: pointer;
    color: var(--muted);
    font-size: .88rem;
    padding: 6px 0;
    list-style: none;
    text-align: center;
  }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .tt {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 6px;
    margin-top: 10px;
  }
  .tt span {
    background: var(--card2);
    border-radius: 8px;
    text-align: center;
    padding: 6px 0;
    font-size: .88rem;
    font-variant-numeric: tabular-nums;
  }
  .tt span.past { opacity: .3; }
  .tt span.next { background: rgba(76,194,255,.2); color: var(--accent); font-weight: 700; }

  .info { font-size: .82rem; color: var(--muted); line-height: 1.7; }
  .info b { color: var(--text); }
  footer { text-align: center; color: #55697a; font-size: .72rem; margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>駿景園 穿梭巴士</h1>
    <div class="sub">NR815 · 駿景園 ⇄ 沙田新城市廣場第一期 · 冠忠遊覽車</div>
  </header>

  <div class="card">
    <div class="dir-toggle">
      <button class="dir-btn active" id="dirRA" onclick="setDir('ra')">
        駿景園 開
        <small>往新城市廣場</small>
      </button>
      <button class="dir-btn" id="dirNTP" onclick="setDir('ntp')">
        新城市廣場 開
        <small>往駿景園</small>
      </button>
    </div>
    <div class="day-row">
      <span class="day-badge" id="dayBadge"></span>
      <button class="override" id="overrideBtn" onclick="cycleOverride()">手動切換 ▾</button>
    </div>
  </div>

  <div class="card">
    <div class="now" id="nowTime"></div>
    <div id="main"></div>
    <div class="upcoming" id="upcoming"></div>
  </div>

  <div class="card">
    <details>
      <summary>全日班次時間表</summary>
      <div class="tt" id="fullTT"></div>
    </details>
  </div>

  <div class="card info">
    <b>車費：</b>$5.5（單程）<br>
    <b>上客點：</b>駿景園平台 / 新城市廣場第一期<br>
    <b>營辦商：</b>冠忠遊覽車有限公司（電話 2856 8391）
  </div>

  <footer>
    班次資料來源：駿景園官網（royalascothk.com）<br>
    實際班次或因交通情況調整，僅供參考
  </footer>
</div>

<script>
// ===== 班次資料（來源：royalascothk.com）=====
const RA_WEEKDAY = [
"06:30","06:40","06:50","07:00","07:08","07:16","07:24","07:32","07:40","07:48","07:56","08:04",
"08:12","08:20","08:28","08:36","08:44","08:52","09:00","09:10","09:20","09:30","09:40","09:50",
"10:00","10:10","10:20","10:30","10:40","10:50","11:00","11:10","11:20","11:30","11:40","11:50",
"12:00","12:10","12:20","12:30","12:40","12:50","13:00","13:10","13:20","13:30","13:40","13:50",
"14:00","14:10","14:20","14:30","14:40","14:50","15:00","15:10","15:20","15:30","15:40","15:50",
"16:00","16:10","16:18","16:26","16:34","16:42","16:50","16:58","17:06","17:14","17:22","17:30",
"17:36","17:42","17:48","17:54","18:00","18:06","18:12","18:18","18:24","18:30","18:36","18:42",
"18:48","18:54","19:00","19:06","19:12","19:18","19:24","19:30","19:36","19:42","19:48","19:54",
"20:00","20:10","20:20","20:30","20:40","20:50","21:00","21:10","21:20","21:30","21:40","21:50",
"22:05","22:20","22:35","22:50"
];
const RA_HOLIDAY = [
"06:30","06:45","07:00","07:15","07:30","07:45","08:00","08:10","08:20","08:30",
"08:40","08:50","09:00","09:10","09:20","09:30","09:40","09:50","10:00","10:10",
"10:20","10:30","10:40","10:50","11:00","11:10","11:20","11:30","11:40","11:50",
"12:00","12:10","12:20","12:30","12:40","12:50","13:00","13:10","13:20","13:30","13:40","13:50",
"14:00","14:08","14:16","14:24","14:32","14:40","14:48","14:56","15:04","15:12","15:20","15:28","15:36","15:44",
"15:52","16:00","16:08","16:16","16:24","16:32","16:40","16:48","16:56","17:04","17:12","17:20","17:28","17:36","17:44","17:52",
"18:00","18:08","18:16","18:24","18:32","18:40","18:48","18:56","19:04",
"19:12","19:20","19:28","19:36","19:44","19:52","20:00","20:08","20:16","20:24","20:32","20:40","20:48","20:56",
"21:04","21:12","21:20","21:28","21:36","21:44","21:56","22:08","22:20","22:35","22:50"
];
const NTP_WEEKDAY = [
"06:40","06:50","07:00","07:10","07:18","07:26","07:34","07:42","07:50","07:58","08:06","08:14",
"08:22","08:30","08:38","08:46","08:54","09:02","09:10","09:20","09:30","09:40","09:50","10:00",
"10:10","10:20","10:30","10:40","10:50","11:00","11:10","11:20","11:30","11:40","11:50",
"12:00","12:10","12:20","12:30","12:40","12:50","13:00","13:10","13:20","13:30","13:40","13:50",
"14:00","14:10","14:20","14:30","14:40","14:50","15:00","15:10","15:20","15:30","15:40","15:50",
"16:00","16:10","16:20","16:28","16:36","16:44","16:52","17:00","17:08","17:16","17:24","17:32",
"17:40","17:46","17:52","17:58","18:04","18:10","18:16","18:22","18:28","18:34","18:40","18:46",
"18:52","18:58","19:04","19:10","19:16","19:22","19:28","19:34","19:40","19:46","19:52","19:58",
"20:04","20:10","20:20","20:30","20:40","20:50","21:00","21:10","21:20","21:30","21:40","21:50",
"22:00","22:15","22:30","22:45","23:00"
];
const NTP_HOLIDAY = [
"06:40","06:55","07:10","07:25","07:40","07:55","08:10","08:20","08:30","08:40",
"08:50","09:00","09:10","09:20","09:30","09:40","09:50","10:00","10:10","10:20",
"10:30","10:40","10:50","11:00","11:10","11:20","11:30","11:40","11:50",
"12:00","12:10","12:20","12:30","12:40","12:50","13:00","13:10","13:20","13:30","13:40","13:50",
"14:00","14:10","14:18","14:26","14:34","14:42","14:50","14:58","15:06","15:14","15:22","15:30","15:38","15:46",
"15:54","16:02","16:10","16:18","16:26","16:34","16:42","16:50","16:58","17:06","17:14","17:22","17:30","17:38",
"17:46","17:54","18:02","18:10","18:18","18:26","18:34","18:42","18:50","18:58","19:06","19:14",
"19:22","19:30","19:38","19:46","19:54","20:02","20:10","20:18","20:26","20:34","20:42","20:50","20:58","21:06",
"21:14","21:22","21:30","21:38","21:46","21:54","22:06","22:18","22:30","22:45","23:00"
];

// ===== 香港公眾假期（2026–2027，之後年份請自行更新）=====
const PUBLIC_HOLIDAYS = new Set([
  // 2026
  "2026-01-01","2026-02-17","2026-02-18","2026-02-19",
  "2026-04-03","2026-04-04","2026-04-06","2026-04-07",
  "2026-05-01","2026-05-25","2026-06-19","2026-07-01",
  "2026-09-26","2026-10-01","2026-10-19","2026-12-25","2026-12-26",
  // 2027
  "2027-01-01","2027-02-06","2027-02-08","2027-02-09",
  "2027-03-26","2027-03-27","2027-03-29","2027-04-05",
  "2027-05-01","2027-05-13","2027-06-09","2027-07-01",
  "2027-09-16","2027-10-01","2027-10-08","2027-12-25","2027-12-27"
]);

// ===== 狀態 =====
let dir = "ra";                 // "ra" = 駿景園開, "ntp" = 新城市開
let overrideMode = 0;           // 0=自動, 1=強制平日, 2=強制六日假期

function setDir(d) {
  dir = d;
  document.getElementById("dirRA").classList.toggle("active", d === "ra");
  document.getElementById("dirNTP").classList.toggle("active", d === "ntp");
  render();
}

function cycleOverride() {
  overrideMode = (overrideMode + 1) % 3;
  render();
}

function isoDate(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

// 回傳 "weekday" | "holiday"
function autoDayType(d) {
  const dow = d.getDay();
  if (dow === 0 || dow === 6) return "holiday";
  if (PUBLIC_HOLIDAYS.has(isoDate(d))) return "holiday";
  return "weekday";
}

function effectiveDayType(d) {
  if (overrideMode === 1) return "weekday";
  if (overrideMode === 2) return "holiday";
  return autoDayType(d);
}

function getTimetable(d) {
  const type = effectiveDayType(d);
  if (dir === "ra") return type === "weekday" ? RA_WEEKDAY : RA_HOLIDAY;
  return type === "weekday" ? NTP_WEEKDAY : NTP_HOLIDAY;
}

function dayLabel(d) {
  const type = effectiveDayType(d);
  const dow = d.getDay();
  if (type === "weekday") return "平日班次";
  if (overrideMode === 2 && autoDayType(d) === "weekday") return "假期班次（手動）";
  if (dow === 0 || dow === 6) return "六／日班次";
  return "公眾假期班次";
}

function toMins(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

function fmtCountdown(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m <= 0) return s + " 秒";
  if (m >= 60) {
    const h = Math.floor(m / 60);
    return h + " 小時 " + (m % 60) + " 分";
  }
  return m + " 分 " + String(s).padStart(2, "0") + " 秒";
}

function render() {
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const nowSec = now.getSeconds();

  document.getElementById("nowTime").textContent =
    "而家 " + now.toTimeString().slice(0, 8);
  document.getElementById("dayBadge").textContent = dayLabel(now);
  document.getElementById("overrideBtn").textContent =
    overrideMode === 0 ? "自動偵測 ▾" :
    overrideMode === 1 ? "手動：平日 ▾" : "手動：假期 ▾";

  const tt = getTimetable(now);
  const main = document.getElementById("main");
  const upcoming = document.getElementById("upcoming");

  const nowTotal = nowMin * 60 + nowSec;
  // 班次 HH:MM 於該分鐘內（:00–:59）仍當作可以搭
  const nextIdx = tt.findIndex(t => toMins(t) * 60 + 60 > nowTotal);

  if (nextIdx === -1) {
    // 今日已無班次
    const tmr = new Date(now);
    tmr.setDate(tmr.getDate() + 1);
    const tmrTT = getTimetable(tmr);
    main.innerHTML =
      '<div class="ended">今日班次已開出晒<small>聽日頭班 ' + tmrTT[0] +
      "（" + (effectiveDayType(tmr) === "weekday" ? "平日" : "假期") + "班次）</small></div>";
    upcoming.innerHTML = "";
  } else {
    const next = tt[nextIdx];
    const diffSec = toMins(next) * 60 - nowTotal;
    const cdText = diffSec <= 0 ? "開出中！" : "仲有 " + fmtCountdown(diffSec);
    const cls = diffSec <= 120 ? "soon" : "ok";
    main.innerHTML =
      '<div class="next-label">下一班車</div>' +
      '<div class="next-time">' + next + "</div>" +
      '<div class="countdown ' + cls + '">' + cdText + "</div>";

    const rest = tt.slice(nextIdx + 1, nextIdx + 4);
    let html = "<h3>之後班次</h3>";
    rest.forEach(t => {
      const d = toMins(t) * 60 - nowTotal;
      html += '<div class="bus-row"><span>' + t +
        '</span><span class="in">' + fmtCountdown(d) + "後</span></div>";
    });
    if (rest.length === 0) html += '<div class="bus-row"><span style="color:var(--muted)">呢班係尾班車</span></div>';
    upcoming.innerHTML = html;
  }

  // 全日時間表
  const full = document.getElementById("fullTT");
  full.innerHTML = tt.map(t => {
    let cls = toMins(t) * 60 + 60 <= nowTotal ? "past" : "";
    if (nextIdx !== -1 && t === tt[nextIdx]) cls = "next";
    return '<span class="' + cls + '">' + t + "</span>";
  }).join("");
}

render();
setInterval(render, 1000);
</script>
</body>
</html>
